# This repository's own delegation settings. It develops itself with itself.

default_worker = "claude"

[workers.claude]
adapter = "claude"
enabled = true
light = { model = "haiku", effort = "medium" }
standard = { model = "sonnet", effort = "high" }
frontier = { model = "opus", effort = "xhigh" }

# OpenCode Go has a monthly allowance, so it is chosen per task rather than
# being the default.
[workers.opencode]
adapter = "opencode"
enabled = true
light = { model = "opencode-go/deepseek-v4-flash", effort = "medium" }
standard = { model = "opencode-go/kimi-k2.7-code", effort = "high" }
frontier = { model = "opencode-go/glm-5.2", effort = "high" }

[workers.codex]
adapter = "codex"
enabled = true
light = { model = "gpt-6-luna", effort = "high" }
standard = { model = "gpt-6.1-terra", effort = "high" }
frontier = { model = "gpt-6.1-sol", effort = "high" }

[roles.artifact-auditor]
level = "standard"

[roles.repo-cartographer]
level = "light"

[roles.bounded-implementer]
level = "standard"
requires_allowed_writes = true

[roles.verification-runner]
level = "standard"
runs_commands = true

[roles.consistency-auditor]
level = "light"

[roles.adversarial-critic]
level = "standard"
timeout = 3600
[workers.agy]
adapter = "agy"
enabled = true
light = { model = "gemini-3.8-flash", effort = "high" }
standard = { model = "gemini-3.8-flash", effort = "high" }


