# Copy to .claude/delegate.toml in your repository, fill in models you can
# actually reach, and set enabled = true on the worker you want to use.
#
# Nothing here is on by default. Until a worker is enabled, `delegate submit`
# refuses and says so, and the plugin changes nothing about your session.

default_worker = "codex"

# --- workers ----------------------------------------------------------------
#
# A worker says what each level means for itself. A role asking for a level the
# worker does not define is refused before anything starts.

[workers.codex]
adapter = "codex"
enabled = false
light = { model = "gpt-5.6-luna", effort = "high" }
standard = { model = "gpt-5.6-terra", effort = "high" }
frontier = { model = "gpt-5.6-sol", effort = "xhigh" }

[workers.opencode]
adapter = "opencode"
enabled = false
# Run `opencode models` and use the provider/model form it prints.
light = { model = "", effort = "medium" }
standard = { model = "", effort = "high" }
frontier = { model = "", effort = "high" }

[workers.claude]
adapter = "claude"
enabled = false
light = { model = "haiku", effort = "medium" }
standard = { model = "sonnet", effort = "high" }
frontier = { model = "opus", effort = "xhigh" }

# --- roles ------------------------------------------------------------------
#
# A role asks for a level, never a model, so the same roles work whichever
# worker you enabled above.

[roles.artifact-auditor]
level = "standard"

[roles.repo-cartographer]
level = "light"

[roles.bounded-implementer]
level = "standard"
requires_allowed_writes = true

[roles.verification-runner]
level = "standard"

[roles.consistency-auditor]
level = "light"

[roles.adversarial-critic]
level = "frontier"
timeout = 3600
